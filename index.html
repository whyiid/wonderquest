<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="WonderQuest" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <title>WonderQuest 🔭 — Learn something new every day</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <button class="brand" data-go="#/today" aria-label="Go to Today">
      <span class="brand-mark">🔭</span>
      <span class="brand-name">WonderQuest</span>
    </button>
    <div class="topbar-stats">
      <span class="chip chip-streak" id="chip-streak" title="Day streak">🔥 <b>0</b></span>
      <span class="chip chip-xp" id="chip-xp" title="Wonder points">⭐ <b>0</b></span>
    </div>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <nav class="tabbar" role="navigation">
    <button class="tab" data-go="#/today"><span>🌞</span>Today</button>
    <button class="tab" data-go="#/explore"><span>🧭</span>Explore</button>
    <button class="tab" data-go="#/collection"><span>🏅</span>Collection</button>
    <button class="tab" data-go="#/settings"><span>⚙️</span>Settings</button>
  </nav>

  <script src="data.js"></script>
  <script src="progress.js"></script>
  <script src="ui.js"></script>
  <script src="daily.js"></script>
  <script src="article.js"></script>
  <script src="explore.js"></script>
  <script src="collection.js"></script>
  <script src="parent.js"></script>
  <script src="app.js"></script>
</body>
</html>
